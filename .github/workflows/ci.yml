name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    services:
      # Base jetable pour les tests d'authentification et de génération (vidée à chaque lancement).
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Chromium pour le moteur de rendu
        run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Sur main, une fois les vérifications passées, l'image est publiée sur GitHub (ghcr.io, privée) :
  # Azure Container Apps la tire de là (doc 10). Sur une pull request, elle est seulement construite.
  image:
    name: Image Docker
    needs: verifier
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUBLIER: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUBLIER == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUBLIER == 'true' }}
          tags: |
            ghcr.io/kango-hamed/aeemci-studio:latest
            ghcr.io/kango-hamed/aeemci-studio:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
