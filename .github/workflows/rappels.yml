name: Rappels des activités

# Chaque jour à 18 h (Abidjan, UTC+0) : notifications de rappel pour les activités du lendemain.
# Variable du dépôt `ADRESSE_APPLICATION` (https://…sslip.io) et secret `RAPPELS_SECRET`
# (même valeur que sur le serveur), doc 10, section 7. Sans eux, la tâche ne fait rien.

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  rappels:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler /api/notifications/rappels
        env:
          ADRESSE: ${{ vars.ADRESSE_APPLICATION }}
          SECRET: ${{ secrets.RAPPELS_SECRET }}
        run: |
          if [ -z "$ADRESSE" ] || [ -z "$SECRET" ]; then
            echo "Rappels non configurés (doc 10, section 7)."
            exit 0
          fi
          # Nouvel essai sur une panne passagère seulement (délai, 5xx) : un refus (401) s'arrête tout de suite.
          curl -fsS --retry 3 --retry-delay 20 --max-time 180 \
            -X POST -H "Authorization: Bearer $SECRET" "$ADRESSE/api/notifications/rappels"
